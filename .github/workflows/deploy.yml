name: Deploy to TestFlight

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: archive-and-upload
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check Apple Developer secrets
        id: secret_check
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -z "$ASC_KEY_ID" ]]; then
            echo "::notice::Apple Developer Program not yet wired up (APP_STORE_CONNECT_API_KEY_ID secret is empty). Skipping TestFlight upload. Populate the three ASC secrets and re-run when ready."
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        if: steps.secret_check.outputs.have_secrets == 'true'
        run: brew install xcodegen
      - name: Generate Xcode project
        if: steps.secret_check.outputs.have_secrets == 'true'
        working-directory: ios
        run: xcodegen generate
      # TODO(deploy-todo): TestFlight signing/provisioning is NOT wired here yet.
      # `ios/project.yml` ships with `DEVELOPMENT_TEAM: ""` and this job installs no
      # signing certificate or provisioning profile. As a result, even with the three
      # ASC API secrets populated, `bundle exec fastlane beta` will fail at archive/
      # signing on a GitHub-hosted runner. The follow-up `deploy-todo` sub-task must
      # add ONE of:
      #   (a) fastlane match (recommended) — store certs+profiles in a private git
      #       repo and call `match(type: "appstore", readonly: true)` in the :beta
      #       lane before `build_ios_app`, OR
      #   (b) Apple-issued cert + profile installed via apple-actions/import-codesign-certs
      #       and apple-actions/download-provisioning-profiles before fastlane runs,
      #       with DEVELOPMENT_TEAM and PROVISIONING_PROFILE_SPECIFIER injected into
      #       project.yml via a per-config override.
      # Until that is done, this job will fail on tag push when secrets are populated.
      - name: Set up Ruby + Bundler cache
        if: steps.secret_check.outputs.have_secrets == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Decode App Store Connect API private key
        if: steps.secret_check.outputs.have_secrets == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p fastlane
          echo "$ASC_PRIVATE_KEY" | base64 --decode > fastlane/asc_api_key.p8
          chmod 600 fastlane/asc_api_key.p8
      - name: Run fastlane beta (TestFlight upload)
        if: steps.secret_check.outputs.have_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/fastlane/asc_api_key.p8
        run: bundle exec fastlane beta
      - name: Cleanup secret material
        if: always()
        run: rm -f fastlane/asc_api_key.p8
