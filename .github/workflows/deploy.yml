name: Deploy to TestFlight

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: archive-and-upload
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple Developer secrets
        id: secret_check
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -z "$ASC_KEY_ID" ]]; then
            echo "::notice::Apple Developer Program not yet wired up (APP_STORE_CONNECT_API_KEY_ID secret is empty). Skipping TestFlight upload. Populate the three ASC secrets and re-run when ready."
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check ios/Act.xcodeproj exists
        if: steps.secret_check.outputs.have_secrets == 'true'
        id: project_check
        run: |
          if [[ -d "ios/Act.xcodeproj" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ios/Act.xcodeproj does not exist. Run the scaffold-ios sub-task before tagging a release."
            exit 1
          fi
      - name: Set up Ruby + Bundler cache
        if: steps.secret_check.outputs.have_secrets == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Decode App Store Connect API private key
        if: steps.secret_check.outputs.have_secrets == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p fastlane
          echo "$ASC_PRIVATE_KEY" | base64 --decode > fastlane/asc_api_key.p8
          chmod 600 fastlane/asc_api_key.p8
      - name: Run fastlane beta (TestFlight upload)
        if: steps.secret_check.outputs.have_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/fastlane/asc_api_key.p8
        run: bundle exec fastlane beta
      - name: Cleanup secret material
        if: always()
        run: rm -f fastlane/asc_api_key.p8
