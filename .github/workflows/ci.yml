name: CI

on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-doc-check:
    name: design-doc-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for immutability diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main if remote exists
        run: |
          if git ls-remote --exit-code origin main >/dev/null 2>&1; then
            git fetch origin main:refs/remotes/origin/main || true
          else
            echo "::notice::origin/main not reachable; immutability diff will be skipped"
          fi
      - name: Run design-doc invariants
        run: bash scripts/check-design-docs.sh

  swift-lint:
    name: swift-lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging ios/

  xcode-test:
    name: xcode-test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Ensure iOS 18.1 simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 18\.1"; then
            echo "iOS 18.1 simulator runtime not present; downloading via xcodebuild -downloadPlatform iOS"
            sudo xcodebuild -downloadPlatform iOS -buildVersion 18.1 || sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes | grep "iOS 18" || true
      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Act.xcodeproj -scheme Act
      - name: Build + test
        working-directory: ios
        # SNAPSHOT_TESTING_RECORD=never: fail loudly if a reference PNG is absent
        # rather than silently creating it in the ephemeral runner and losing it.
        # Developers must run with SNAPSHOT_TESTING_RECORD=all locally and commit
        # the generated PNGs before CI will accept snapshot tests.
        env:
          SNAPSHOT_TESTING_RECORD: never
        run: |
          set -o pipefail
          xcodebuild test \
            -project Act.xcodeproj \
            -scheme Act \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.1' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult
      - name: Upload TestResults on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_id }}.xcresult
          path: ios/TestResults.xcresult
          retention-days: 14
      - name: Upload __snapshots__ directory for human verification
        # CI runs with SNAPSHOT_TESTING_RECORD=never, so it does NOT seed new
        # PNGs — a missing reference is a hard test failure. This artifact
        # exposes the PNGs that ARE committed (plus any failure-diff PNGs
        # swift-snapshot-testing writes alongside on mismatch) so reviewers can
        # inspect rendered references without an iOS 18.1 simulator locally.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: ios/ActTests/__snapshots__/
          if-no-files-found: ignore
          retention-days: 14
