name: CI

on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: >-
          Record snapshot reference PNGs on CI's renderer instead of verifying.
          Run on a feature branch, download the `snapshots-<run_id>` artifact,
          commit the PNGs, then push for a normal verifying run.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Same-repo PRs are skipped at the job level: the push event on the head branch
# already runs the full pipeline, and GitHub attaches those check runs to the PR
# by head SHA. The pull_request trigger is kept solely for fork PRs.

jobs:
  design-doc-check:
    name: design-doc-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for immutability diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch origin/main if remote exists
        run: |
          if git ls-remote --exit-code origin main >/dev/null 2>&1; then
            git fetch origin main:refs/remotes/origin/main || true
          else
            echo "::notice::origin/main not reachable; immutability diff will be skipped"
          fi
      - name: Run design-doc invariants
        run: bash scripts/check-design-docs.sh

  swift-lint:
    name: swift-lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned so lint results are reproducible (brew installed latest-at-runtime
      # before). Keep .githooks/pre-push guidance in sync when bumping.
      SWIFTLINT_VERSION: 0.63.3
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint (pinned, static Linux binary)
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o swiftlint.zip swiftlint -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/swiftlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sanity-check custom hex-color rule fires on Linux
        # The no_random_hex_color rule uses match_kinds (SourceKit-dependent).
        # Prove it still fires on the static Linux build so a silently dead rule
        # can never pass CI looking green.
        run: |
          echo 'let probe = "#FF00AA"' > ios/CIHexRuleProbeDeleteMe.swift
          if swiftlint lint --quiet --reporter json ios/ | grep -q 'no_random_hex_color'; then
            echo "custom rule fired as expected"
          else
            echo "::error::no_random_hex_color custom rule did not fire on the Linux SwiftLint build"
            exit 1
          fi
          rm ios/CIHexRuleProbeDeleteMe.swift
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging ios/

  xcode-test:
    name: xcode-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/SourcePackages
          # No committed Package.resolved (the xcodeproj is generated), so key on
          # project.yml, where package pins live. restore-keys lets a stale cache
          # still seed most checkouts after a dependency bump.
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Ensure iOS 26.5 simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 26\.5"; then
            echo "iOS 26.5 simulator runtime not present; downloading via xcodebuild -downloadPlatform iOS"
            sudo xcodebuild -downloadPlatform iOS -buildVersion 26.5 || sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes | grep "iOS 26" || true
      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Act.xcodeproj \
            -scheme Act \
            -clonedSourcePackagesDirPath SourcePackages
      - name: Build + test
        working-directory: ios
        # Normal runs: SNAPSHOT_TESTING_RECORD=never — a missing reference PNG is
        # a hard failure, never silently seeded in the ephemeral runner. To MINT
        # references on CI's exact renderer, run this workflow via the Actions tab
        # with `record_snapshots=true`; that run records (and is allowed to "fail"
        # the assertions) and uploads the PNGs as the `snapshots-<run_id>` artifact
        # for a human to download + commit. Then a normal push verifies them green.
        # The TEST_RUNNER_ prefix is required: xcodebuild does NOT forward its
        # own environment into the simulator test process. It only forwards
        # variables prefixed TEST_RUNNER_, stripping the prefix, so the test
        # process sees SNAPSHOT_TESTING_RECORD. Without the prefix the library
        # never saw the value and record runs silently produced nothing.
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: ${{ github.event.inputs.record_snapshots == 'true' && 'all' || 'never' }}
        run: |
          set -o pipefail
          status=0
          xcodebuild test \
            -project Act.xcodeproj \
            -scheme Act \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult || status=$?
          if [ "${{ github.event.inputs.record_snapshots }}" = "true" ]; then
            echo "::notice::record run — ignoring test status $status; recorded PNGs uploaded as snapshots-${{ github.run_id }}"
            exit 0
          fi
          exit $status
      - name: Upload TestResults on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_id }}.xcresult
          path: ios/TestResults.xcresult
          retention-days: 14
      - name: Upload __snapshots__ directory for human verification
        # CI runs with SNAPSHOT_TESTING_RECORD=never, so it does NOT seed new
        # PNGs — a missing reference is a hard test failure. This artifact
        # exposes the PNGs that ARE committed (plus any failure-diff PNGs
        # swift-snapshot-testing writes alongside on mismatch) so reviewers can
        # inspect rendered references without an iOS 26.5 simulator locally.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: ios/ActTests/__snapshots__/
          # warn (not ignore): upload-artifact skips hidden files, so a
          # __snapshots__/ holding only .gitkeep counts as "no files". A record
          # run that produced no PNGs should be visible, not silent.
          if-no-files-found: warn
          retention-days: 14
